<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../css/registration.css">
</head>
<body>
    <div class="container">
            
        <div class="card">
            <div id="heading"><h2>Registration</h2>
            </div>
            <h5>One Account is all you need to access all 'AI Smart Study Alarm System' services.</h5> 
            <br>
            <br> 
            <div class="details">
                <h4>Email</h4>
                <input type="email" id="email" placeholder="e.g example@gmail.com">
               
                <br>
                <br>
                 <h4>Name</h4>
                <input type="text" id="full-name" placeholder="Full_Name(first mid last)">
                
                <input type="text" id="username" placeholder="Username">
                <br>
                <br>
                <input type="text" id="highest-class" placeholder="Highest Qualification">
        
                <input type="text" id="school-name" placeholder="School/College Name">
                <br>
                <br>
                <h4>Current Location</h4>
                <input type="text" id="city" placeholder="City">
                <input type="text" id="state" placeholder="State">
                <input type="text" id="country" placeholder="Country">
                <br>
                <br>
                <h4>Work History</h4>
                <input type="text" id="job-title" placeholder="Job Title">
                <input type="text" id="company-name" placeholder="Company Name">
                <input type="number" id="years-of-experience" placeholder="Year of Experience">
                <br>
                <br>
                <h4>Key Skills</h4>
                <input type="text" id="key-skills" placeholder="Key skills">
                <br>
                <br>
                <h4>Set Password</h4>
                <input type="password" id="password" placeholder="password">
            </div>
            <button id="registerbtn">Register</button>
            <br>
            <h5 style="color: rgb(113, 112, 112);">already have an account-> <a href="login.html">SignIN</a></h5>
            <br>
            <div class="responsebox">
                
            </div>
        </div>
    </div>
    
</body>
<script src="../javascript/registration.js"></script>
</html>
